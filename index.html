<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>霓虹多食物贪食蛇</title>
<style>
body{
  margin:0;
  height:100vh;
  background:radial-gradient(circle,#1b0040,#030008 75%);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  font-family:Arial,"Microsoft YaHei";
  color:white;
}
#info{
  position:absolute;
  top:22px;
  font-size:24px;
  text-shadow:0 0 15px #00ffff;
}
canvas{
  background:rgba(0,0,0,.35);
  border:3px solid #00ffff;
  border-radius:16px;
  box-shadow:0 0 25px #00ffff,inset 0 0 30px #ff00ff;
}
</style>
</head>
<body>

<div id="info">得分：<span id="score">0</span>　速度：<span id="speed">普通</span></div>
<canvas id="game" width="500" height="500"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const speedEl = document.getElementById("speed");

const grid = 20;
const count = canvas.width / grid;

let snake, food, dx, dy, score, gameOver;
let speed = 120;
let lastMove = 0;
let particles = [];

const foods = [
  {emoji:"🍎", type:"normal", score:1,  text:"普通", color:"#ff1744"},
  {emoji:"⚡", type:"fast",   score:1,  text:"加速", color:"#ffff00"},
  {emoji:"🧊", type:"slow",   score:1,  text:"减速", color:"#00e5ff"},
  {emoji:"💎", type:"double", score:2,  text:"双倍", color:"#ff00ff"}
];

function reset(){
  snake = [{x:12,y:12}];
  food = createFood();
  dx = 1;
  dy = 0;
  score = 0;
  speed = 120;
  gameOver = false;
  particles = [];
  scoreEl.textContent = score;
  speedEl.textContent = "普通";
}

function rand(n){
  return Math.floor(Math.random() * n);
}

function createFood(){
  const item = foods[rand(foods.length)];
  return {
    x: rand(count),
    y: rand(count),
    ...item
  };
}

function addParticles(x,y,color){
  for(let i=0;i<30;i++){
    particles.push({
      x:x*grid+10,
      y:y*grid+10,
      vx:(Math.random()-.5)*7,
      vy:(Math.random()-.5)*7,
      life:35,
      color
    });
  }
}

function drawGrid(){
  ctx.strokeStyle = "rgba(0,255,255,.08)";
  for(let i=0;i<=count;i++){
    ctx.beginPath();
    ctx.moveTo(i*grid,0);
    ctx.lineTo(i*grid,canvas.height);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0,i*grid);
    ctx.lineTo(canvas.width,i*grid);
    ctx.stroke();
  }
}

function drawSnake(){
  snake.forEach((p,i)=>{
    const hue = (Date.now()/20 + i*25) % 360;
    ctx.fillStyle = `hsl(${hue},100%,60%)`;
    ctx.shadowBlur = i === 0 ? 30 : 18;
    ctx.shadowColor = ctx.fillStyle;

    ctx.beginPath();
    ctx.roundRect(p.x*grid+2,p.y*grid+2,grid-4,grid-4,6);
    ctx.fill();
  });
}

function drawFood(){
  const pulse = Math.sin(Date.now()/150)*3 + 16;

  ctx.font = `${pulse}px Arial`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.shadowBlur = 30;
  ctx.shadowColor = food.color;
  ctx.fillText(food.emoji, food.x*grid+10, food.y*grid+11);
}

function drawParticles(){
  particles.forEach((p,i)=>{
    p.x += p.vx;
    p.y += p.vy;
    p.life--;

    ctx.globalAlpha = p.life / 35;
    ctx.fillStyle = p.color;
    ctx.shadowBlur = 20;
    ctx.shadowColor = p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,4,0,Math.PI*2);
    ctx.fill();

    if(p.life <= 0) particles.splice(i,1);
  });

  ctx.globalAlpha = 1;
}

function moveSnake(){
  const head = {
    x: snake[0].x + dx,
    y: snake[0].y + dy
  };

  if(head.x<0 || head.y<0 || head.x>=count || head.y>=count){
    gameOver = true;
    return;
  }

  for(const p of snake){
    if(p.x === head.x && p.y === head.y){
      gameOver = true;
      return;
    }
  }

  snake.unshift(head);

  if(head.x === food.x && head.y === food.y){
    score += food.score;

    if(food.type === "fast"){
      speed = Math.max(55, speed - 15);
      speedEl.textContent = "加速";
    }

    if(food.type === "slow"){
      speed = Math.min(220, speed + 20);
      speedEl.textContent = "减速";
    }

    if(food.type === "double"){
      speedEl.textContent = "双倍积分";
    }

    if(food.type === "normal"){
      speedEl.textContent = "普通";
    }

    scoreEl.textContent = score;
    addParticles(food.x, food.y, food.color);
    food = createFood();
  }else{
    snake.pop();
  }
}

function drawGameOver(){
  ctx.fillStyle = "rgba(0,0,0,.7)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.textAlign = "center";
  ctx.fillStyle = "#fff";
  ctx.shadowBlur = 30;
  ctx.shadowColor = "#ff00ff";
  ctx.font = "46px Arial";
  ctx.fillText("GAME OVER",250,220);

  ctx.font = "22px Arial";
  ctx.shadowColor = "#00ffff";
  ctx.fillText("按空格重新开始",250,270);
}

function loop(time){
  ctx.shadowBlur = 0;
  ctx.fillStyle = "rgba(5,0,20,.35)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  drawGrid();
  drawFood();
  drawParticles();
  drawSnake();

  if(!gameOver && time - lastMove > speed){
    moveSnake();
    lastMove = time;
  }

  if(gameOver){
    drawGameOver();
  }

  requestAnimationFrame(loop);
}

document.addEventListener("keydown",e=>{
  if(gameOver && e.code === "Space"){
    reset();
    return;
  }

  if(e.key === "ArrowUp" && dy !== 1){ dx=0; dy=-1; }
  if(e.key === "ArrowDown" && dy !== -1){ dx=0; dy=1; }
  if(e.key === "ArrowLeft" && dx !== 1){ dx=-1; dy=0; }
  if(e.key === "ArrowRight" && dx !== -1){ dx=1; dy=0; }
});

reset();
requestAnimationFrame(loop);
</script>

</body>
</html>
